<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letterboxd Roulette</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <aside class="users-sidebar">
            <h3>Users</h3>
            <div id="users-list"></div>
            <button id="all-done-btn" class="all-done-btn" disabled>Sync Up!</button>
        </aside>

        <main class="main-content">
            <header>
                <div class="logo">
                    <span class="logo-circles">
                        <span class="circle orange"></span>
                        <span class="circle green"></span>
                        <span class="circle blue"></span>
                    </span>
                    <h1>Coincine</h1>
                </div>
                <p class="subtitle">Spin your watchlist.</p>
            </header>

            <section class="controls">
                <input type="text" id="username" placeholder="Letterboxd Username" value="" />
                <button id="sync-btn">Add User</button>
                <button id="clear-btn" class="btn-secondary">Clear All</button>
            </section>

            <section class="roulette-container">
                <div id="movie-display" class="movie-display">
                    <div class="premium-roulette">
                        <div class="roulette-marker"></div>
                        <canvas id="roulette-wheel" width="800" height="800"></canvas>
                        <div class="roulette-center"></div>
                    </div>

                    <div class="spin-controls">
                        <button id="spin-btn" disabled>SPIN</button>
                    </div>

                    <div class="config-group">
                        <div class="max-movies-group">
                            <div class="limit-input-wrapper">
                                <label for="max-movies-input">Movie limit:</label>
                                <input type="number" id="max-movies-input" value="20" min="2" max="100">
                            </div>
                            <button id="reload-btn" class="icon-btn" title="Reload roulette">↺</button>
                        </div>
                    </div>

                    <div class="modes-group">
                        <span class="modes-label">Build the roulette by:</span>
                        <div class="modes-container">
                            <button id="mix-btn" class="mode-btn active">Mixing</button>
                            <button id="match-btn" class="mode-btn">Matching</button>
                        </div>
                    </div>

                    <div class="modes-group">
                        <span class="modes-label">Roulette will choose the:</span>
                        <div class="modes-container">
                            <button id="select-mode-btn" class="mode-btn active">Winner</button>
                            <button id="eliminate-mode-btn" class="mode-btn">Looser</button>
                        </div>
                    </div>


            </section>

            <div id="result-modal" class="modal hidden">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h2 id="winner-title">Movie Title</h2>
                    <a id="winner-link" href="#" target="_blank" class="btn-letterboxd">View on Letterboxd</a>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
