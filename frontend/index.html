<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letterboxd Roulette</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="logo-circles">
                    <span class="circle orange"></span>
                    <span class="circle green"></span>
                    <span class="circle blue"></span>
                </span>
                <h1>Letterboxd Roulette</h1>
            </div>
            <p class="subtitle">Spin your watchlist.</p>
        </header>

        <section class="controls">
            <input type="text" id="username" placeholder="Letterboxd Username" value="jonathanfujii" />
            <button id="sync-btn">Sync Watchlist</button>
        </section>

        <section class="roulette-container">
            <div id="movie-display" class="movie-display">
                <div class="pointer"></div>
                <canvas id="roulette-wheel" width="800" height="800"></canvas>
            </div>
            <button id="spin-btn" disabled>SPIN</button>
        </section>

        <div id="result-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="winner-title">Movie Title</h2>
                <img id="winner-poster" src="" alt="Winner Poster">
                <a id="winner-link" href="#" target="_blank" class="btn-letterboxd">View on Letterboxd</a>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
